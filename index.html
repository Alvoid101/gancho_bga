<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="css/index.css">
    <title>Gancho</title>
    
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">
                <img src="img/Logo_gancho.png" alt="Logo Gancho" width="80" height="80" class="d-inline-block align-text-top">
            </a>
            <div class="navbar-nav flex-row">
                <li class="nav-item px-2">
                    <a class="nav-link active" href="index.html">Inicio</a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link" href="colecciones.html">Colecciones</a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link" href="contacto.html">Contactanos</a>
                </li>
            </div>
        </div>

    

    </nav>

    <!-- Carrusel de nuevas colecciones -->
    <div id="carouselColecciones" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselColecciones" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselColecciones" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselColecciones" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#carouselColecciones" data-bs-slide-to="3"></button>
            <button type="button" data-bs-target="#carouselColecciones" data-bs-slide-to="4"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="data/Anturio/Anturio_Modelo.png" class="d-block mx-auto carousel-img" alt="Colección Anturio">
                <div class="carousel-caption">
                    <h3>Colección Anturio</h3>
                </div>
            </div>
            <div class="carousel-item">
                <img src="data/Cayena/Cayena_Modelo.png" class="d-block mx-auto carousel-img" alt="Colección Cayena">
                <div class="carousel-caption">
                    <h3>Colección Cayena</h3>
                </div>
            </div>
            <div class="carousel-item">
                <img src="data/Clavel/Clavel_Modelo.png" class="d-block mx-auto carousel-img" alt="Colección Clavel">
                <div class="carousel-caption">
                    <h3>Colección Clavel</h3>
                </div>
            </div>
            <div class="carousel-item">
                <img src="data/Heliconia/Heliconia_Modelo.png" class="d-block mx-auto carousel-img" alt="Colección Heliconia">
                <div class="carousel-caption">
                    <h3>Colección Heliconia</h3>
                </div>
            </div>
            <div class="carousel-item">
                <img src="data/Orquidea/Orquidea_Modelo.png" class="d-block mx-auto carousel-img" alt="Colección Orquídea">
                <div class="carousel-caption">
                    <h3>Colección Orquídea</h3>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselColecciones" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselColecciones" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>
</body>
</html>
